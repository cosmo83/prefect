[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prefect-cloudfoundry"
version = "0.1.0"
description = "Prefect integrations for executing flow runs as serverless Cloud Foundry tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache License 2.0" }
keywords = ["prefect", "cloudfoundry"]
authors = [{ name = "Prefect Technologies, Inc.", email = "help@prefect.io" }]
classifiers = [
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "prefect>=3.0.0",
    "httpx>=0.23.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
    "pytest-env",
    "respx>=0.21.1",
]

[project.entry-points."prefect.collections"]
prefect_cloudfoundry = "prefect_cloudfoundry"

[tool.setuptools]
packages = ["prefect_cloudfoundry"]

[tool.uv.sources]
prefect = { path = "../../../" }

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
env = ["PREFECT_TEST_MODE=1"]
